[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dl-demos"
version = "0.1.0"
description = "Educational deep learning implementations and tutorials"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "babel>=2.16",
    "einops>=0.8",
    "faker>=37",
    "lmdb>=1.6",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "opencv-python>=4.11",
    "pillow>=11",
    "regex>=2024.11",
    "requests>=2.32",
    "six>=1.17",
    "torch>=2.5",
    "torchvision>=0.20",
    "tqdm>=4.67",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2",
    "pytest>=8.3",
    "ruff>=0.13",
]

[[tool.uv.index]]
name = "tencent-pypi"
url = "https://mirrors.cloud.tencent.com/pypi/simple"
default = true

[tool.setuptools.packages.find]
include = ["chapters*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "single"
